services:
  postgres:
    image: postgres:16-alpine
    container_name: help_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-help}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-help}
      POSTGRES_DB: ${POSTGRES_DB:-help}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - help_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-help} -d ${POSTGRES_DB:-help}"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    container_name: help_api
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    env_file:
      - .env
    ports:
      - "${API_PORT:-3333}:3333"

volumes:
  help_postgres_data:
